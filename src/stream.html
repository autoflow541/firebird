<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebird Stream</title>
<style>
/* Self-contained so it works as an OBS Browser Source. Transparent by default
   (overlay use); add ?bg=1 to the URL for a full moving background. */
:root{ --gold:#D4A017; --ink:#0a0b0f; }
*{ box-sizing:border-box; margin:0; }
html,body{ width:100%; height:100%; overflow:hidden; background:transparent; font-family:"Atkinson Hyperlegible",Inter,Segoe UI,Arial,sans-serif; color:#fff; }
/* Moving scene background (only shown with ?bg=1). Mirrors the projector look. */
#bg{ position:fixed; inset:0; display:none; background:radial-gradient(circle at 50% 55%,#482033,transparent 30%),radial-gradient(circle at 50% 50%,#160c12,#000 70%); transition:background 1s; }
#bg.on{ display:block; }
#bg:before{ content:""; position:absolute; inset:-50%; background:conic-gradient(from 0deg,transparent,#ef31531c,transparent,#765fff22,transparent); animation:spin 20s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
/* Lower-third overlay. */
.lower{ position:fixed; left:48px; bottom:48px; display:flex; align-items:center; gap:16px;
  padding:16px 22px; background:rgba(10,11,15,.72); border-left:4px solid var(--gold);
  backdrop-filter:blur(6px); border-radius:2px; }
.mark{ width:44px; height:50px; display:grid; place-items:center; background:var(--gold); color:#141414;
  font-weight:900; font-size:26px; clip-path:polygon(20% 0,100% 0,78% 43%,100% 43%,15% 100%,38% 55%,0 55%); }
.meta b{ font-size:26px; letter-spacing:.02em; display:block; line-height:1.1; }
.meta .sub{ font:12px "JetBrains Mono",Consolas,monospace; letter-spacing:.18em; color:var(--gold); margin-top:5px; text-transform:uppercase; }
.live{ position:fixed; right:48px; top:44px; font:12px "JetBrains Mono",Consolas,monospace; letter-spacing:.2em; color:#fff; display:flex; align-items:center; gap:8px; }
.live i{ width:9px; height:9px; border-radius:50%; background:#ff3b3b; box-shadow:0 0 10px #ff3b3b; animation:pulse 1.4s infinite; }
@keyframes pulse{ 50%{ opacity:.35; } }
.blackout .lower{ opacity:.25; }
</style></head>
<body>
  <div id="bg"></div>
  <div class="live"><i></i> LIVE</div>
  <div class="lower">
    <span class="mark" aria-hidden="true">F</span>
    <div class="meta"><b id="song">Firebird</b><span class="sub" id="sub">INTRO · 128 BPM</span></div>
  </div>
  <script src="stream.js"></script>
</body></html>
